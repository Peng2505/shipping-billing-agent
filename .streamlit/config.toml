[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F6F8FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2937"
font = "\"Microsoft YaHei\", \"PingFang SC\", \"Noto Sans SC\", \"Source Han Sans SC\", \"Segoe UI\", sans-serif"
headingFont = "\"Microsoft YaHei\", \"PingFang SC\", \"Noto Sans SC\", \"Source Han Sans SC\", \"Segoe UI\", sans-serif"
codeFont = "\"Cascadia Code\", \"Consolas\", \"Courier New\", monospace"
borderColor = "#E2E8F0"
dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F8FAFC"
dataframeHeaderTextColor = "#475569"
showWidgetBorder = true
baseRadius = "0.5rem"
buttonRadius = "0.45rem"
showSidebarBorder = true
baseFontSize = 15
headingFontSizes = ["1.375rem", "1.125rem", "1rem", "0.9375rem", "0.875rem", "0.8125rem"]
codeFontSize = "0.8125rem"
linkColor = "#2563EB"
codeBackgroundColor = "#F1F5F9"
codeTextColor = "#1F2937"
paddingTop = "1rem"
paddingBottom = "1.75rem"

[theme.sidebar]
backgroundColor = "#EEF2F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2937"
primaryColor = "#2563EB"
borderColor = "#D8E0EA"
paddingTop = "0.85rem"
paddingBottom = "1rem"

[server]
headless = true
maxUploadSize = 20

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
