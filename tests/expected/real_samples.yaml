    issuer_contains: "ZIM American Integrated Shipping Services"
    recipient_contains: "ALL AMERICA FORWARDING"
    booking_no: "ZIMUNGB1312144"
    bl_no: "ZIMUNGB1312144"
    container_no: "JXLU4504463"
    charges:
      - {raw_name: "WHARFAGE ADMINISTRATION FEE", amount: "5.00", currency: USD, quantity: null}
