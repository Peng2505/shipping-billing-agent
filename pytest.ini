[pytest]
testpaths = tests
addopts = -ra
markers =
    real_ocr: calls the real OCR API (needs network + OSS credentials)
    real_oss: calls the real Aliyun OSS bucket (needs credentials)
    real_llm: calls the real LLM API (needs LLM_API_KEY)
filterwarnings =
    ignore::DeprecationWarning:xlwt.*
