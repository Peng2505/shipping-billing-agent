name = "ocr-file-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Private R2 binding — do NOT enable public bucket access.
[[r2_buckets]]
binding = "OCR_BUCKET"
bucket_name = "shipping-ocr-tmp"
# preview_bucket_name = "shipping-ocr-tmp-preview"

[vars]
KEY_PREFIX = "ocr-tmp/"

# Secrets (set via `wrangler secret put`, never commit):
#   UPLOAD_TOKEN
#   HMAC_SECRET
